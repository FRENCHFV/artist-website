<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5F1E8">
  <meta name="description" content="FV. — สร้างเพลงในแบบที่เป็นตัวเอง">
  <title>FV. — Visual Playground</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #F5F1E8;
      --pale-blue: #DCE7ED;
      --navy: #173A56;
      --slate: #52718A;
      --charcoal: #293640;
      --white: #FFFFFF;
      --line: rgba(23, 58, 86, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      background: var(--cream);
      color: var(--charcoal);
      font-family: "IBM Plex Sans Thai", sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    body,
    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 16px 5%;
      background: rgba(245, 241, 232, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(23, 58, 86, 0.08);
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: "DM Sans", sans-serif;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--navy);
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 7px;
      list-style: none;
    }

    .nav-links a {
      display: inline-block;
      padding: 7px 15px;
      border: 1px solid transparent;
      border-radius: 30px;
      color: var(--navy);
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.7px;
      transition: 0.25s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--white);
    }

    .container {
      width: min(1100px, 90%);
      margin: 0 auto;
    }

    .section {
      padding: 90px 0;
    }

    .section-heading {
      margin-bottom: 38px;
    }

    .section-heading h2 {
      display: inline-block;
      position: relative;
      color: var(--navy);
      font-family: "DM Sans", sans-serif;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1.5px;
    }

    .section-heading h2::after {
      content: "";
      display: block;
      width: 55px;
      height: 4px;
      margin-top: 13px;
      background: var(--slate);
      border-radius: 4px;
    }

    .section-heading p {
      margin-top: 12px;
      color: var(--slate);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 21px;
      border: 1.5px solid var(--navy);
      border-radius: 30px;
      background: transparent;
      color: var(--navy);
      font-family: "DM Sans", "IBM Plex Sans Thai", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    .pill:hover {
      transform: translateY(-2px);
      background: var(--navy);
      color: var(--white);
    }

    .pill.primary {
      background: var(--navy);
      color: var(--white);
    }

    .pill.primary:hover {
      background: var(--slate);
      border-color: var(--slate);
    }

    /* HOME / HERO */

    .hero {
      position: relative;
      min-height: 590px;
      padding: 85px 0 65px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .hero-inner {
      position: relative;
      z-index: 2;
      width: min(1100px, 90%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 45px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: var(--slate);
      font-family: "DM Sans", sans-serif;
      font-size: 11px
