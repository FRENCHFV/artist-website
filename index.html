<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5F1E8">
  <meta name="description" content="FV. — Independent artist from Thailand">
  <title>FV. — Independent Artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #F5F1E8;
      --blue: #DCE7ED;
      --navy: #173A56;
      --slate: #52718A;
      --charcoal: #293640;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 75px;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--navy);
      font-family: "DM Sans", "IBM Plex Sans Thai", sans-serif;
      font-size: 16px;
      line-height: 1.7;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* NAVIGATION */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 12px 6%;
      background: rgba(245, 241, 232, 0.96);
      border-bottom: 1px solid rgba(23, 58, 86, 0.2);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.1em;
      line-height: 1;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .nav-links a {
      padding: 5px 12px;
      border: 1px solid var(--navy);
      border-radius: 50px;
      font-size: 10px;
      font-weight: 700;
      transition: 0.25s;
    }

    .nav-links a:first-child,
    .nav-links a:hover {
      background: var(--navy);
      color: var(--cream);
    }

    /* HOME */
    .hero {
      position: relative;
      min-height: 490px;
      display: flex;
      align-items: center;
      padding: 55px 7% 70px;
      overflow: hidden;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 550px;
      height: 550px;
      top: 0;
      right: -15%;
      background: var(--blue);
      border-radius: 50%;
      animation: float 8s ease-in-out infinite;
    }

    .hero-layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .eyebrow {
      display: inline-block;
      padding: 4px 11px;
      border: 1px solid var(--navy);
      border-radius: 50px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .title-wrap {
      position: relative;
      width: fit-content;
      margin: 25px 0 18px;
    }

    .hero h1,
    .title-shadow {
      margin: 0;
      font-size: clamp(95px, 14vw, 165px);
      line-height: 0.88;
      font-weight: 700;
      letter-spacing: -0.13em;
    }

    .hero h1 {
      position: relative;
      z-index: 2;
    }

    .title-shadow {
      position: absolute;
      top: 9px;
      left: 11px;
      z-index: 1;
      color: transparent;
      -webkit-text-stroke: 1px var(--slate);
      pointer-events: none;
    }

    .tagline {
      margin: 20px 0 10px;
      font-family: "IBM Plex Sans Thai", sans-serif;
      font-size: clamp(20px, 2.6vw, 27px);
      line-height: 1.6;
    }

    .hero-description {
      max-width: 350px;
      color: var(--slate);
      font-size: 13px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border: 1px solid var(--navy);
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      transition: 0.25s;
    }

    .pill.primary {
      background: var(--navy);
      color: var(--cream);
    }

    .pill:hover {
      background: var(--blue);
      color: var(--navy);
      transform: translateY(-2px);
    }

    /* ABOUT BUTTON */
    .about-button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .about-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 25px;
      border: 1px solid var(--navy);
      border-radius: 50px;
      background: var(--navy);
      color: var(--white);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: 0.25s;
    }

    .about-button:hover {
      background: var(--slate);
      color: var(--white);
      transform: translateY(-2px);
    }

    .hero-visual {
      position: relative;
      width: 100%;
      max-width: 330px;
      min-height: 300px;
      margin-left: auto;
    }

    .hero-frame-back {
      position: absolute;
      top: 5%;
      right: 5%;
      width: 76%;
      height: 84%;
      border: 1px solid var(--navy);
      transform: rotate(6deg);
    }

    .hero-frame {
      position: absolute;
      top: 8%;
      right: 10%;
      width: 76%;
      height: 84%;
      padding: 7px;
      background: var(--cream);
      border: 1px solid var(--navy);
      transform: rotate(-3deg);
    }

    .portrait-placeholder {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 250px;
      background: var(--blue);
      overflow: hidden;
    }

    .portrait-placeholder strong {
      font-size: clamp(85px, 12vw, 130px);
      letter-spacing: -0.13em;
      opacity: 0.15;
    }

    .portrait-placeholder span {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .sticker {
      position: absolute;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: grid;
      place-items: center;
      width: 75px;
      height: 75px;
      padding: 8px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--cream);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.5;
      text-align: center;
      transform: rotate(8deg);
    }

    .hero-index {
      position: absolute;
      bottom: 15px;
      left: 7%;
      right: 7%;
      display: flex;
      justify-content: space-between;
      color: var(--slate);
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    /* SHARED SECTIONS */
    .section {
      padding: 65px 7%;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    .section-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--slate);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .section-title {
      display: table;
      margin: 0 0 28px;
      padding-bottom: 7px;
      border-bottom: 2px solid var(--navy);
      font-size: clamp(28px, 4vw, 39px);
      line-height: 1.3;
      letter-spacing: -0.04em;
    }

    /* ABOUT */
    .about {
      background: var(--blue);
    }

    .about[hidden] {
      display: none !important;
    }

    .about-layout {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      align-items: center;
      gap: clamp(30px, 6vw, 70px);
    }

    .about-visual {
      position: relative;
      min-height: 310px;
    }

    .about-outline {
      position: absolute;
      inset: 2% 8% 8% 0;
      border: 1px solid var(--navy);
      transform: rotate(-4deg);
    }

    .about-frame {
      position: absolute;
      inset: 7% 0 0 8%;
      padding: 7px;
      background: var(--cream);
      border: 1px solid var(--navy);
    }

    .about-placeholder {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      min-height: 260px;
      background: var(--cream);
      overflow: hidden;
    }

    .about-placeholder strong {
      font-size: clamp(80px, 11vw, 125px);
      letter-spacing: -0.13em;
      opacity: 0.15;
    }

    .about-placeholder span {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .about-stamp {
      position: absolute;
      right: -3%;
      bottom: 2%;
      padding: 8px 11px;
      background: var(--navy);
      color: var(--cream);
      font-size: 10px;
      transform: rotate(4deg);
    }

    .about-copy p {
      margin: 0 0 20px;
      font-family: "IBM Plex Sans Thai", sans-serif;
      font-size: 16px;
      line-height: 1.95;
    }

    .signature {
      display: inline-block;
      margin-top: 3px;
      padding-top: 12px;
      border-top: 1px solid var(--navy);
      font-family: "IBM Plex Sans Thai", sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    .about-back-wrap {
      margin-top: 24px;
    }

    /* MUSIC */
    .music-intro {
      max-width: 550px;
      margin: -8px 0 28px;
      color: var(--slate);
      font-family: "IBM Plex Sans Thai", sans-serif;
      font-size: 14px;
    }

    .music-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 35px 30px;
    }

    .track {
      min-width: 0;
      width: 100%;
    }

    .cover {
      position: relative;
      width: 100%;
      max-width: 330px;
      margin: 0 auto;
      padding: 7px;
      background: var(--blue);
      border: 1px solid var(--navy);
      transition: transform 0.3s;
    }

      transform
